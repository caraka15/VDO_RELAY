# VDO Relay Nginx vhost.
#
# This file intentionally has no SSL directives. Install it on port 80 first,
# then let Certbot add the HTTPS server blocks:
#   certbot --nginx -d app.example.com -d media.example.com
#
# SRT and WebTransport are not HTTP traffic. Do not proxy ports 8890/8892
# through these locations; Docker publishes those MediaMTX ports directly.

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        # The Go app keeps its own TLS certificate because MediaMTX uses the
        # same certificate for WebTransport on media.example.com:8892.
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_server_name on;
        proxy_ssl_name app.example.com;
        proxy_ssl_verify off;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# The media hostname needs an HTTP vhost so Certbot can validate it. The
# actual media endpoints remain direct:
#   https://media.example.com:8892  (WebTransport)
#   srt://media.example.com:8890    (SRT)
server {
    listen 80;
    listen [::]:80;
    server_name media.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
