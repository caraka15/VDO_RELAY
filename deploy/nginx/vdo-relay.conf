# VDO Relay Nginx vhost.
#
# This file intentionally has no SSL directives. Install it on port 80 first,
# then let Certbot add the HTTPS server blocks:
#   certbot --nginx -d example.com -d media.example.com
#
# WHIP/WHEP uses HTTP for the SDP handshake and UDP for the actual ICE media.
# Nginx handles only the HTTP handshake; UDP 8189 and SRT 8890 stay direct.

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_server_name on;
        proxy_ssl_name app.example.com;
        proxy_ssl_verify off;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name media.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Keep a health URL on the media hostname too, so setup and monitoring can
    # verify both public names without exposing MediaMTX's control API.
    location = /healthz {
        proxy_pass https://127.0.0.1:8443/healthz;
        proxy_ssl_server_name on;
        proxy_ssl_name app.example.com;
        proxy_ssl_verify off;
        proxy_set_header Host app.example.com;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WHIP/WHEP OPTIONS, POST, PATCH and DELETE requests.
    location / {
        proxy_pass https://127.0.0.1:8889;
        proxy_ssl_server_name on;
        proxy_ssl_name media.example.com;
        proxy_ssl_verify off;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
