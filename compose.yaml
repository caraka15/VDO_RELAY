services:
  vdo:
    build:
      context: .
      args:
        MEDIAMTX_VERSION: "1.20.1"
        VDO_UID: "10001"
        VDO_GID: "10001"
    restart: unless-stopped
    ports:
      # Nginx owns public 80/443. The Go app stays reachable only from localhost.
      - "127.0.0.1:8443:8443/tcp"
      # Nginx proxies the WHIP/WHEP HTTP handshake to this loopback port.
      - "127.0.0.1:8889:8889/tcp"
      # ICE media cannot be proxied by the HTTP Nginx vhost.
      - "8189:8189/udp"
      # TCP is the WebRTC fallback when UDP is unavailable.
      - "8189:8189/tcp"
      - "8890:8890/udp"
    environment:
      VDO_PUBLIC_ORIGIN: ${VDO_PUBLIC_ORIGIN:?set VDO_PUBLIC_ORIGIN in .env}
      VDO_WEBRTC_PUBLIC_BASE_URL: ${VDO_WEBRTC_PUBLIC_BASE_URL:?set VDO_WEBRTC_PUBLIC_BASE_URL in .env}
      VDO_SRT_PUBLIC_HOST: ${VDO_SRT_PUBLIC_HOST:?set VDO_SRT_PUBLIC_HOST in .env}
    volumes:
      # SQLite dan recording sengaja berada di host agar rebuild tidak menghapusnya.
      - ./data:/data
      - ./certs:/certs:ro
